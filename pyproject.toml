[project]
name = "vortex-network-panel"
version = "0.1.0"
description = "Self-hosted VORTEX Network Panel"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "jinja2>=3.1,<4",
  "pydantic>=2.8,<3", "python-multipart>=0.0.9,<1", "httpx>=0.27,<1", "itsdangerous>=2.2,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]


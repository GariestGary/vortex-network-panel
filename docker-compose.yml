name: vortex-network-panel

services:
  panel:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    environment:
      VORTEX_MODE: production
      VORTEX_SESSION_SECRET: ${VORTEX_SESSION_SECRET:?set in .env}
      VORTEX_NETCTL_SOCKET: /run/vortex-netctl/vortex-netctl.sock
      VORTEX_PUBLIC_SUBSCRIPTION_URL: ${VORTEX_PUBLIC_SUBSCRIPTION_URL:?set in .env}
    ports:
      - "127.0.0.1:9080:9080"
    volumes:
      - /run/vortex-netctl:/run/vortex-netctl:ro
    group_add:
      - "${VORTEX_NETCTL_GID:?set to host vortex-netctl group GID in .env}"
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
  subscription:
    build: .
    command: ["uvicorn", "app.subscription:app", "--host", "0.0.0.0", "--port", "9081", "--no-access-log"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    environment:
      VORTEX_SUBSCRIPTION_SOCKET: /run/vortex-subscription/subscription.sock
    ports:
      - "127.0.0.1:9081:9081"
    volumes:
      - /run/vortex-subscription:/run/vortex-subscription:ro
    group_add:
      - "${VORTEX_NETCTL_GID:?set to host vortex-netctl group GID in .env}"
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]